[project]
name = "opengrid-drawer-filler"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.1.1",
    "PyYAML>=6.0.3",
    "Jinja2>=3.1.6",
    "pydantic>=2.0.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 5
timeout_method = "thread"
# 默认不跑 integration（需真实 OpenSCAD），手动 `pytest -m integration` 才跑
addopts = "-m 'not integration'"
markers = [
    "integration: end-to-end tests that call real external tools (OpenSCAD, etc.)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
]
