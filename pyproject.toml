[project]
name = "opengrid-drawer-filler"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.1.1",
    "PyYAML>=6.0.3",
    "Jinja2>=3.1.6",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60

[dependency-groups]
dev = [
    "pytest-cov>=7.0.0",
]
